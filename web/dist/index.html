<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fathom-helper</title>
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!--
      The server replaces this placeholder at serve time. The page is
      same-origin and no route sends CORS headers, so script on another origin
      cannot read it back out.
    -->
    <meta name="fath-token" content="__FATH_TOKEN__" />
    <script>
      // Before paint, so the page never flashes the wrong theme.
      try {
        const saved = localStorage.getItem("fath.theme");
        if (saved) document.documentElement.dataset.theme = saved;
      } catch (_) {}
    </script>
    <script type="module" crossorigin src="./assets/app.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
