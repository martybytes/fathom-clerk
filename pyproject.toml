# Tooling config for the Python side of fathom-helper.
#
# There is no package to build here and nothing is published: fath/ runs from the
# clone, invoked by the shell shim. This file exists so ruff, mypy, pytest and
# coverage read the same settings, instead of each caller passing its own flags.

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line length is formatted, not linted
    "SIM108",  # ternaries are not always clearer than an if/else
]

[tool.mypy]
python_version = "3.10"
files = ["fath"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: takes more than a few seconds",
    "live: needs a real Fathom API key and network",
    "pwsh: needs PowerShell 7+",
]

[tool.coverage.run]
branch = true
source = ["fath"]
omit = ["fath/main.py"]  # a sys.path shim with no branches

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
# RATCHET: raise this over time, never lower it.
fail_under = 70
