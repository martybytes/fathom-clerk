# fath subcommand registry -- the single source of truth for the command surface.
#
# Read by three consumers: fath/registry.py, the `Invoke-Fath` shim in $PROFILE,
# and the tab-completion provider. One table means `fath --help` renders the same
# everywhere by construction.
#
# Whitespace-delimited, deliberately NOT JSON -- PowerShell and bash both parse
# this with a split, and it stays diffable. Same convention and same reasoning as
# terminal-stack/tstack/commands.conf.
#
#   <name>  <posix-impl>  <windows-impl>  <summary...>
#
# Implementation tokens:
#
#   python          run fath/main.py <name>
#   -               not supported on this platform; the shim says so plainly
#                   rather than reporting "not found"
#
# Ordered as `fath --help` prints it: daily drivers first, then wiring.

sync      python  python  fetch new meetings into folders
status    python  python  what has been synced, and when
search    python  python  full-text search across transcripts
web       python  python  the browser dashboard
ui        python  python  the terminal dashboard
config    python  python  view and change saved settings
key       python  python  set or clear the Fathom API key
init      python  python  create the settings root and first-run setup
schedule  -       python  install or remove the scheduled task
doctor    python  python  diagnose problems
